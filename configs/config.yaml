# Fed Whisperer Configuration
project:
  name: "fed-whisperer"
  cache_dir: ".cache/fed_whisperer"
  random_seed: 42

scraper:
  base_url: "https://www.federalreserve.gov"
  calendar_url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  historical_url_template: "https://www.federalreserve.gov/monetarypolicy/fomchistorical{year}.htm"
  robots_url: "https://www.federalreserve.gov/robots.txt"
  user_agent: "FedWhispererResearchBot/1.0 (+https://github.com/quant-nlp/fed-whisperer)"
  rate_limit_seconds: 1.5
  timeout_seconds: 20
  min_year: 2018
  max_year: 2026

market_data:
  fred_series:
    dgs2: "DGS2"       # 2-Year Treasury Constant Maturity Rate (%)
    dgs10: "DGS10"     # 10-Year Treasury Constant Maturity Rate (%)
    dff: "DFF"         # Effective Federal Funds Rate (%)
    dfedtaru: "DFEDTARU" # Federal Funds Target Range - Upper Limit (%)
  equity_tickers:
    sp500: "^GSPC"
    spy: "SPY"
  windows_days: [1, 2, 5]

scoring:
  embedding_model: "all-MiniLM-L6-v2"
  llm_model: "gemini-2.5-flash"
  llm_temperature: 0.0
  hawkish_anchors:
    - "Inflation remains elevated and upside risks to prices require further policy firming and rate increases."
    - "Tight labor market conditions and strong price pressures warrant maintaining a restrictive monetary policy stance."
    - "The Committee is prepared to tighten monetary policy further if inflationary pressures persist above target."
    - "Ongoing increases in the target range for the federal funds rate will be appropriate to return inflation to 2 percent."
  dovish_anchors:
    - "Economic activity has slowed and downside risks to employment warrant lowering the target range and accommodative policy."
    - "Inflation has eased substantially toward the 2 percent objective, allowing the Committee to reduce policy restraint."
    - "Weakening labor demand and disinflationary pressures support a more accommodative stance of monetary policy."
    - "The Committee will support maximum employment by cutting the target rate and maintaining ample liquidity."

robustness:
  placebo_iterations: 500
  confidence_level: 0.95
  leave_one_out_regimes:
    - name: "2021 Transitory Era"
      start: "2021-01-01"
      end: "2021-12-31"
    - name: "2022 Aggressive Hiking"
      start: "2022-01-01"
      end: "2022-12-31"
    - name: "2023 Peak Restrictive"
      start: "2023-01-01"
      end: "2023-12-31"
    - name: "2024-2025 Calibration & Easing"
      start: "2024-01-01"
      end: "2025-12-31"
