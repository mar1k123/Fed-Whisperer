project:
  name: "fraud-ring-finder"
  version: "1.0.0"
  seed: 42

generator:
  num_accounts: 1200
  num_devices: 920
  num_merchants: 160
  num_transactions: 16000
  fraud_rate: 0.015  # Configurable between 0.005 (0.5%) and 0.020 (2.0%)
  time_span_days: 30
  pattern_weights:
    money_mule_chain: 0.30
    shared_device_ring: 0.25
    burst_activity: 0.25
    circular_transfer: 0.20
  distribution_shift:
    enabled: true
    mule_chain_length_shifted: 6
    mule_hop_delay_minutes_shifted: 95
    device_ring_proxy_rotation_rate: 0.50
    burst_smurfing_threshold_usd: 490.0

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  strict_temporal_cutoff: true

features:
  pagerank_alpha: 0.85
  velocity_windows_hours: [1, 6, 24]
  include_device_sharing: true
  include_two_hop_motifs: true

models:
  xgboost:
    n_estimators: 220
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    eval_metric: "aucpr"
  graphsage:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.20
    lr: 0.003
    epochs: 80
    loss_type: "focal"  # "focal" or "weighted_bce"
    focal_alpha: 0.85
    focal_gamma: 2.0
  gat:
    hidden_channels: 32
    heads: 4
    num_layers: 2
    dropout: 0.20
    lr: 0.0025
    epochs: 80
    loss_type: "focal"
    focal_alpha: 0.85
    focal_gamma: 2.0

evaluation:
  fixed_precision_targets: [0.70, 0.80, 0.90]
  primary_precision_target: 0.80
  explain_top_k_nodes: 15
  gnn_explainer_hops: 2
  gnn_explainer_epochs: 120
