    <text x="92" y="92" text-anchor="middle" fill="#fff" font-family="ui-monospace, monospace" font-size="10" font-weight="700">C1</text>
    <circle cx="184" cy="88" r="13" fill="#0284c7" />
    <text x="184" y="92" text-anchor="middle" fill="#fff" font-family="ui-monospace, monospace" font-size="10" font-weight="700">C2</text>
    <circle cx="184" cy="162" r="13" fill="#0284c7" />
    <text x="184" y="166" text-anchor="middle" fill="#fff" font-family="ui-monospace, monospace" font-size="10" font-weight="700">C3</text>
    <circle cx="92" cy="162" r="13" fill="#0284c7" />
    <text x="92" y="166" text-anchor="middle" fill="#fff" font-family="ui-monospace, monospace" font-size="10" font-weight="700">C4</text>

