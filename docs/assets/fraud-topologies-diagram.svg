    <line x1="184" y1="88" x2="184" y2="162" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arrBlue)" />
    <line x1="184" y1="162" x2="92" y2="162" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arrBlue)" />
    <line x1="92" y1="162" x2="92" y2="88" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arrBlue)" />

