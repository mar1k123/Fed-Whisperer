<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="splitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="timeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#splitBg)" stroke="#1e293b" stroke-width="2" />

  <text x="32" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">
    Strict Chronological Split &amp; Leak-Free Graph Feature Extraction (Zero Future Edge Leakage)
  </text>
  <text x="32" y="60" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    For any split boundary t_cutoff, PageRank, degree, shared-device cliques, and GNN message passing only access edges with timestamp &lt;= t_cutoff.
  </text>

  <!-- Chronological Time Axis Line -->
  <line x1="32" y1="82" x2="1164" y2="82" stroke="#475569" stroke-width="1.5" marker-end="url(#timeArrow)" />
  <text x="32" y="76" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">t = Day 1 (00:00)</text>
  <text x="672" y="76" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">t_train_cutoff (70%)</text>
  <text x="914" y="76" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10" font-weight="700">t_val_cutoff (85%)</text>
  <text x="1156" y="76" text-anchor="end" fill="#fb7185" font-family="ui-monospace, monospace" font-size="10" font-weight="700">t_test_end (Day 30)</text>

  <!-- Timeline Bar -->
  <g transform="translate(32, 96)">
    <!-- Train 70% -->
    <rect x="0" y="0" width="640" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="26" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">
      TRAIN WINDOW [0% – 70%] · Days 1–21 (2,520 txs)
    </text>
    <text x="20" y="46" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">
      Fit XGBoost (scale_pos_weight) + GraphSAGE &amp; GAT (Focal Loss γ=2.0, α=0.85)
    </text>
    <text x="20" y="62" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">
      Graph topology &amp; PageRank computed strictly on G_train = { e in E : timestamp(e) &lt;= t_train_cutoff }
    </text>

    <!-- Validation 15% -->
    <rect x="652" y="0" width="230" height="72" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="668" y="26" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="13" font-weight="700">
      VAL (70% – 85%]
    </text>
    <text x="668" y="46" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">
      Days 22–26 (540 txs)
    </text>
    <text x="668" y="62" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">
      Calibrate Precision ≥ 80% threshold
    </text>

    <!-- Test 15% -->
    <rect x="894" y="0" width="242" height="72" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5" />
    <text x="910" y="26" fill="#fb7185" font-family="ui-monospace, monospace" font-size="13" font-weight="700">
      TEST (85% – 100%]
    </text>
    <text x="910" y="46" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">
      Days 27–30 (540 txs)
    </text>
    <text x="910" y="62" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">
      Standard + Shifted Fraud Tactics
    </text>
  </g>

  <!-- Invariant Proof Strip -->
  <g transform="translate(32, 190)" font-family="ui-monospace, monospace" font-size="12">
    <rect x="0" y="0" width="365" height="62" rx="8" fill="#090d16" stroke="#334155" />
    <text x="16" y="24" fill="#4ade80" font-weight="700">✓ Invariant 1: Strict Temporal Order</text>
    <text x="16" y="44" fill="#94a3b8" font-size="11">max(t_train) &lt; min(t_val) &lt; min(t_test)</text>

    <rect x="382" y="0" width="372" height="62" rx="8" fill="#090d16" stroke="#334155" />
    <text x="398" y="24" fill="#4ade80" font-weight="700">✓ Invariant 2: Future Tamper Proof</text>
    <text x="398" y="44" fill="#94a3b8" font-size="11">Mutating t &gt; t_train yields ΔX_train = 0.0000</text>

    <rect x="771" y="0" width="365" height="62" rx="8" fill="#090d16" stroke="#334155" />
    <text x="787" y="24" fill="#4ade80" font-weight="700">✓ Invariant 3: Dual Explainability</text>
    <text x="787" y="44" fill="#94a3b8" font-size="11">TreeSHAP Waterfall + GNNExplainer 2-Hop</text>
  </g>
</svg>
